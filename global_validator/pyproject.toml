[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-terminology-validator"
version = "1.1.0"
description = "Deterministic global terminology evidence validator"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18,<5",
  "referencing>=0.30,<1",
]

[project.scripts]
global-validator = "global_validator.v1.cli:main"

[tool.setuptools]
package-dir = {global_validator = "."}
packages = [
  "global_validator",
  "global_validator.v1",
  "global_validator.v1.audit",
  "global_validator.v1.authority",
  "global_validator.v1.calibration",
  "global_validator.v1.certificates",
  "global_validator.v1.decision",
  "global_validator.v1.features",
  "global_validator.v1.gates",
  "global_validator.v1.input",
  "global_validator.v1.testing",
  "global_validator.v1.tools",
]

[tool.setuptools.package-data]
"global_validator.v1" = ["policies/*.json"]

[tool.pytest.ini_options]
testpaths = ["v1/tests"]

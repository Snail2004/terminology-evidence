[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminology-contracts"
version = "1.1.0"
description = "Shared JSON contracts for English-Vietnamese terminology validation"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5", "referencing>=0.30,<1"]

[project.scripts]
term-contracts = "terminology_contracts.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
